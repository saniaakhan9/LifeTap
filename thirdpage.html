<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeTap - Register</title>
  
  <!-- Instant Theme Applicator (Syncs theme from Page 1 / Page 2 without flash) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('lifetap_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Connected CSS -->
  <link rel="stylesheet" href="thirdpage.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="firstpage.html" class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <span class="logo-text">LifeTap</span>
      </a>

      <nav class="nav-links">
        <a href="firstpage.html" class="nav-item">Home</a>
        <a href="firstpage.html#about" class="nav-item">About</a>
        <a href="#contact" class="nav-item">Contact</a>
      </nav>

      <!-- Theme Switcher (Synchronized & Persistent) -->
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-container">
      
      <!-- Left Content & Heart-Shaped Illustration matching Reference -->
      <div class="left-panel fade-in-left">
        <h1 class="welcome-title">Create Your<br>LifeTap Account</h1>
        <p class="welcome-desc">Take a step towards a safer and more secure future.</p>

        <!-- Heart-Shaped Image Frame -->
        <div class="illustration-area float-anim">
          <div class="heart-frame">
            <img src="https://i.ibb.co/LD6NNNTC/Gemini-Generated-Image-k578m1k578m1k578.png" alt="LifeTap Emergency Illustration" class="illustration-img">
          </div>
        </div>

        <p class="tagline">Quick. Easy. Secure.</p>
      </div>

      <!-- Right Glassmorphism Registration Form Card -->
      <div class="right-panel fade-in-right">
        <div class="login-card glass-panel">
          
          <div class="form-header">
            <h2>Register</h2>
            <p>Create your account to get started</p>
          </div>

          <form id="registerForm" novalidate>
            <!-- Dynamic Alert Message -->
            <div id="errorBanner" class="alert-banner hidden">
              <i class="fa-solid fa-circle-exclamation"></i>
              <span id="errorMessage">Invalid input</span>
            </div>

            <!-- Full Name Input -->
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fa-regular fa-user input-icon"></i>
                <input type="text" id="regName" placeholder="Full Name" required>
              </div>
            </div>

            <!-- Email Address Input -->
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fa-regular fa-envelope input-icon"></i>
                <input type="email" id="regEmail" placeholder="Email Address" required>
              </div>
            </div>

            <!-- Password Input -->
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="regPassword" placeholder="Password" required>
                <button type="button" class="toggle-password" id="togglePassword1" aria-label="Toggle password visibility">
                  <i class="fa-regular fa-eye" id="eyeIcon1"></i>
                </button>
              </div>
            </div>

            <!-- Confirm Password Input -->
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
                <button type="button" class="toggle-password" id="togglePassword2" aria-label="Toggle confirm password visibility">
                  <i class="fa-regular fa-eye" id="eyeIcon2"></i>
                </button>
              </div>
            </div>

            <!-- Terms & Conditions Checkbox -->
            <div class="terms-group">
              <label class="checkbox-label">
                <input type="checkbox" id="termsCheckbox" required>
                <span>I agree to the <a href="#" class="terms-link">Terms & Conditions</a></span>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block btn-glow">
              Create Account
            </button>
          </form>

          <!-- Link to Page 2 (Login) -->
          <div class="card-footer">
            <p>Already have an account? <a href="secondpage.html" class="register-link">Login here</a></p>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Connected JS -->
  <script src="thirdpage.js"></script>
</body>
</html>
