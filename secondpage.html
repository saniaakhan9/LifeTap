<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeTap - Login</title>
  
  <!-- Instant Theme Applicator (Syncs theme from Page 1 without flash) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('lifetap_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark-theme');
      }
    })();
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Connected CSS -->
  <link rel="stylesheet" href="secondpage.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="firstpage.html" class="logo">
        <div class="logo-icon">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <span class="logo-text">LifeTap</span>
      </a>

      <nav class="nav-links">
        <a href="firstpage.html" class="nav-item">Home</a>
        <a href="firstpage.html#about" class="nav-item">About</a>
        <a href="#contact" class="nav-item">Contact</a>
      </nav>

      <!-- Theme Switcher (Synchronized & Persistent) -->
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
      </button>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-container">
      
      <!-- Left Content & Heart-Shaped Illustration -->
      <div class="left-panel fade-in-left">
        <h1 class="welcome-title">Welcome Back!</h1>
        <p class="welcome-desc">Login to access your LifeTap emergency profile.</p>

        <!-- Heart-Shaped Image Frame -->
        <div class="illustration-area float-anim">
          <div class="heart-frame">
            <img src="https://i.ibb.co/LD6NNNTC/Gemini-Generated-Image-k578m1k578m1k578.png" alt="LifeTap Emergency Illustration" class="illustration-img">
          </div>
        </div>

        <p class="tagline">Your safety in your hands.</p>
      </div>

      <!-- Right Glassmorphism Form Card -->
      <div class="right-panel fade-in-right">
        <div class="login-card glass-panel">
          
          <div class="form-header">
            <h2>Login</h2>
            <p>Access your LifeTap account</p>
          </div>

          <form id="loginForm" novalidate>
            <!-- Dynamic Alert Message -->
            <div id="errorBanner" class="alert-banner hidden">
              <i class="fa-solid fa-circle-exclamation"></i>
              <span id="errorMessage">Invalid credentials</span>
            </div>

            <!-- Email Input -->
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fa-regular fa-envelope input-icon"></i>
                <input type="email" id="loginEmail" placeholder="Email Address" required>
              </div>
            </div>

            <!-- Password Input -->
            <div class="input-group">
              <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                  <i class="fa-regular fa-eye" id="eyeIcon"></i>
                </button>
              </div>
            </div>

            <!-- Forgot Password Option -->
            <div class="form-options">
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-block btn-glow">
              Login
            </button>
          </form>

          <!-- Link to Page 3 (Registration) -->
          <div class="card-footer">
            <p>Don't have an account? <a href="thirdpage.html" class="register-link">Register here</a></p>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Connected JS -->
  <script src="secondpage.js"></script>
</body>
</html>
